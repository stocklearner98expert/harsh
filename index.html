<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ગુજરાતી Trader — Live Profit</title>
<meta name="description" content="Gujarati Trader stock market community landing page">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f7f6f4;
    color:#151515;
  }
  a{text-decoration:none;color:inherit}
  .page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow:hidden;
  }
  .container{
    width:min(100%,680px);
    padding:0 22px 42px;
    text-align:center;
  }

  /* Logo */
  .logo-wrap{
    width:220px;
    height:220px;
    margin:-30px auto 8px;
    border-radius:50%;
    background:#fff;
    border:1px solid #e6e6e6;
    box-shadow:0 5px 25px rgba(0,0,0,.05);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .logo-wrap:before{
    content:"";
    position:absolute;
    inset:15px;
    border:1px dashed #cfcfcf;
    border-radius:50%;
  }
  .logo-png{
    position:relative;
    z-index:1;
    width:92%;
    height:92%;
    object-fit:contain;
    display:block;
  }
  .logo-img{
    position:relative;
    z-index:1;
    width:88%;
    height:88%;
    object-fit:contain;
    display:block;
  }

  .logo-image{
    position:relative;
    z-index:2;
    width:176px;
    height:176px;
    object-fit:contain;
    border-radius:50%;
    display:block;
  }
  .logo-fallback{
    position:relative;
    z-index:1;
    font-weight:900;
    line-height:.9;
  }

  .logo{
    position:relative;
    z-index:1;
    font-weight:900;
    line-height:.9;
  }
  .logo .guj{font-size:27px}
  .logo .trader{font-size:22px;color:#1e9b55}
  .logo .turban{font-size:31px;margin-right:4px}
  .logo .tag{
    display:inline-block;
    margin-top:7px;
    background:#f3cf00;
    padding:3px 12px;
    border-radius:2px;
    font-size:10px;
    font-weight:800;
  }

  h1{
    margin:4px 0 5px;
    font-size:46px;
    line-height:1.05;
    font-weight:900;
    letter-spacing:-1.8px;
  }
  h1 .red{color:#e23b25}
  .subtitle{
    font-size:20px;
    font-weight:800;
    margin:15px 0 7px;
  }
  .journey{
    color:#666;
    font-size:18px;
    margin:0 0 12px;
  }
  .members{
    color:#555;
    font-size:17px;
    font-weight:700;
    margin:0 0 30px;
  }
  .members span{color:#1ca653}

  .telegram{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:92%;
    margin:0 auto 46px;
    min-height:72px;
    border-radius:38px;
    background:linear-gradient(90deg,#ed3028,#ff6b00);
    color:#fff;
    font-size:22px;
    font-weight:900;
    box-shadow:0 14px 28px rgba(239,66,25,.22);
    transition:.2s transform,.2s box-shadow;
  }
  .telegram:hover{transform:translateY(-2px);box-shadow:0 17px 34px rgba(239,66,25,.28)}
  .telegram .rocket{font-size:24px}

  .section-title{
    margin:0 0 18px;
    color:#cf3030;
    font-size:22px;
    font-weight:900;
  }
  .section-title:before{content:"• ";}

  .profit-card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:27px;
    overflow:hidden;
    text-align:left;
    box-shadow:0 2px 10px rgba(0,0,0,.035);
  }
  .profit-header{
    min-height:94px;
    padding:27px 31px 20px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    border-bottom:1px solid #e7e7e7;
  }
  .profit-header h2{
    margin:0;
    font-size:22px;
    font-weight:900;
  }
  .live-badge{
    background:#e8f8ee;
    color:#19984e;
    padding:8px 16px;
    border-radius:22px;
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
  }
  .live-dot{
    display:inline-block;
    width:7px;height:7px;
    background:#1a9d54;
    border-radius:50%;
    margin-right:5px;
    vertical-align:1px;
    animation:pulse 1.2s infinite;
  }


  .live-entry{
    animation: clientIn .55s ease both;
  }
  @keyframes clientIn{
    from{
      opacity:0;
      transform:translateY(18px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  .profit-row{
    min-height:87px;
    padding:18px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #e7e7e7;
  }
  .profit-row:last-child{border-bottom:0}
  .person{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:21px;
    font-weight:900;
  }
  .avatar{
    width:27px;height:27px;
    border-radius:50%;
    position:relative;
    background:#1679c9;
  }
  .avatar:before{
    content:"";
    position:absolute;
    width:10px;height:10px;
    border-radius:50%;
    background:#fff;
    left:8.5px;top:4px;
  }
  .avatar:after{
    content:"";
    position:absolute;
    width:18px;height:10px;
    border-radius:12px 12px 4px 4px;
    background:#fff;
    left:4.5px;bottom:3px;
  }
  .amount{
    color:#17994e;
    font-size:20px;
    font-weight:900;
    white-space:nowrap;
  }
  .amount .arrow{font-size:17px;margin-right:4px}

  .demo-notice{
    margin:12px auto 0;
    max-width:620px;
    padding:10px 14px;
    border-radius:10px;
    background:#fff7df;
    border:1px solid #f0df9d;
    color:#725b14;
    font-size:12px;
    line-height:1.45;
  }
  .updated{
    color:#777;
    font-size:12px;
    margin-top:10px;
    text-align:right;
  }

  /* Small floating badge similar to the screenshot */
  .powered{
    position:fixed;
    right:0;
    bottom:28px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 14px 7px 8px;
    background:#101e49;
    color:#fff;
    border-radius:35px 0 0 35px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    font-size:12px;
    z-index:20;
  }
  .powered .s{
    width:38px;height:38px;
    border-radius:50%;
    background:#148fd4;
    display:grid;
    place-items:center;
    font-size:23px;
    font-weight:900;
  }
  .powered b{font-size:15px;color:#36a9ef}
  .powered .arrow{font-size:27px;margin-left:2px}

  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.35;transform:scale(.75)}
  }
  @keyframes flash{
    0%{transform:translateY(0);opacity:1}
    50%{transform:translateY(-2px);opacity:.65}
    100%{transform:translateY(0);opacity:1}
  }
  .amount.changed{animation:flash .35s ease}

  @media(max-width:520px){
    .container{padding:0 16px 35px}
    .logo-wrap{width:205px;height:205px;margin-top:-22px}
    h1{font-size:39px}
    .subtitle{font-size:18px}
    .journey{font-size:17px}
    .members{font-size:16px}
    .telegram{width:94%;min-height:68px;font-size:19px;margin-bottom:40px}
    .section-title{font-size:20px}
    .profit-header{padding:23px 20px 17px}
    .profit-row{padding:16px 20px;min-height:76px}
    .person{font-size:18px}
    .amount{font-size:17px}
    .live-badge{font-size:12px;padding:7px 11px}
  }

  @media(max-width:370px){
    h1{font-size:34px}
    .amount{font-size:15px}
    .person{font-size:17px}
    .profit-row{padding-left:14px;padding-right:14px}
  }
</style>

<div class="page">
  <main class="container">
    <div class="logo-wrap" aria-label="Harsh Bhagat logo">
      <!-- Put your logo image in the same folder and name it: logo.png -->
      <img src="logo.png" alt="Harsh Bhagat Logo" class="logo-image"

    <!-- Replace # with your real Telegram invite URL -->

<script>
const firstNames = [
  "Aarav","Aditi","Akash","Amit","Ananya","Anil","Anjali","Arjun","Ashish","Ayush",
  "Bhavesh","Bharat","Chetan","Deepak","Deepika","Dhruv","Divya","Gaurav","Hetal","Himanshu",
  "Isha","Jatin","Jignesh","Karan","Kavita","Kiran","Krishna","Manish","Meena","Mehul",
  "Mohit","Monika","Naveen","Neha","Nikhil","Nisha","Pankaj","Pooja","Prakash","Priya",
  "Rahul","Raj","Rakesh","Ravi","Reena","Rohit","Riya","Sachin","Sahil","Sanjay",
  "Saurabh","Seema","Shivam","Shreya","Sneha","Sonal","Sonali","Suresh","Tanmay","Tanya",
  "Tarun","Uday","Varun","Vikas","Vijay","Vikram","Vinay","Vishal","Yash","Yogesh",
  "Zoya","Abhishek","Adarsh","Ajay","Alok","Amol","Aniket","Ankita","Anurag","Bhavna",
  "Chirag","Darshan","Dinesh","Hiral","Jay","Jaya","Komal","Mahesh","Mansi","Mayank",
  "Nandini","Nitin","Parth","Payal","Rachit","Radhika","Rajesh","Ritu","Rohan","Vaishnavi"
];

const clients = firstNames.map((name, index) => ({
  name,
  amount: Math.floor(5000 + Math.random() * 195000),
  id: index + 1
}));

const rowContainer = document.getElementById("profitRows");
const updatedEl = document.getElementById("lastUpdated");

let currentIndex = 0;

function formatINR(value){
  return new Intl.NumberFormat("en-IN", {
    maximumFractionDigits: 0
  }).format(Math.round(value));
}

function showNextClient(){
  const client = clients[currentIndex];

  // Small profit movement each time this client is shown.
  client.amount += Math.floor(Math.random() * 2500) + 250;

  rowContainer.innerHTML = `
    <div class="profit-row live-entry">
      <div class="person">
        <span class="avatar"></span>
        <span>${client.name}</span>
      </div>
      <div class="amount">
        <span class="arrow">▲</span> +₹${formatINR(client.amount)}
      </div>
    </div>
  `;

  updatedEl.textContent = `${client.name} • Live update just now`;

  currentIndex = (currentIndex + 1) % clients.length;
}

function openTelegram(event){
  event.preventDefault();
  // Replace with your real Telegram invite URL.
  alert("Add your Telegram invite link in the HTML first.");
}

// First client appears immediately.
showNextClient();

// Then one NEW client appears after another.
// Change 3000 to 2000, 5000, etc. for a different speed.
setInterval(showNextClient, 3000);
</script>
